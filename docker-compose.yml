services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - "127.0.0.1:9105:5672"  # AMQP
      - "127.0.0.1:9106:15672"  # Management UI
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network
      - certificate_com_network

  redis:
    image: redis:7.2-alpine
    container_name: redis_cache
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-securepassword123}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-securepassword123}
    ports:
      - "127.0.0.1:9107:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-securepassword123}", "--raw", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: redisinsight
    ports:
      - "127.0.0.1:9108:5540"
    volumes:
      - redisinsight_data:/db
    environment:
      - REDISINSIGHT_HOST=0.0.0.0  # Allow external connections
    restart: unless-stopped
    networks:
      - app-network
  fastapi:
    build: .
    container_name: fastapi
    ports:
      - "127.0.0.1:8000:8000" # Expose Next.js on port 3000
    depends_on:
      - rabbitmq # Add dependency so Next.js starts after MongoDB
      - redis
      - redisinsight
    volumes:
      - ./temp_certificates:/app/temp_certificates
      - ./tmp:/app/tmp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network
      - certificate_com_network
networks:
  app-network:
    driver: bridge
  certificate_com_network:
    external: true
volumes:
  redis_data:
    name: redis_data
  rabbitmq_data:
    name: rabbitmq_data
  redisinsight_data:
    name: redisinsight_data