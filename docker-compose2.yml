services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - "127.0.0.1:9105:5672"  # AMQP
      - "127.0.0.1:9106:15672"  # Management UI
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:7.2-alpine
    container_name: redis_cache
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-securepassword123}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-securepassword123}
    ports:
      - "127.0.0.1:9107:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-securepassword123}", "--raw", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: redisinsight
    ports:
      - "127.0.0.1:9108:5540"
    volumes:
      - redisinsight_data:/db
    environment:
      - REDISINSIGHT_HOST=0.0.0.0  # Allow external connections
    restart: unless-stopped
    networks:
      - app-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cert-api
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MINIO_ENDPOINT: host.docker.internal
      MINIO_PORT: "9000"
      MONGODB_URI: mongodb://admin:L4run1Cert2025@host.docker.internal:27017/certification?authSource=admin
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./temp_certificates:/app/temp_certificates
      - ./temp_reports:/app/temp_reports
      - ./tmp:/app/tmp
    restart: unless-stopped
    networks:
      - app-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: cert-worker
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MINIO_ENDPOINT: host.docker.internal
      MINIO_PORT: "9000"
      MONGODB_URI: mongodb://admin:L4run1Cert2025@host.docker.internal:27017/certification?authSource=admin
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./temp_certificates:/app/temp_certificates
      - ./temp_reports:/app/temp_reports
      - ./tmp:/app/tmp
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
volumes:
  redis_data:
    name: redis_data
  rabbitmq_data:
    name: rabbitmq_data
  redisinsight_data:
    name: redisinsight_data