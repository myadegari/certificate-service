[project]
name = "cert-publish-microservise"
version = "0.1.0"
description = ""
authors = [
    {name = "myadegari",email = "myadegari37@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "python-pptx (>=1.0.2,<2.0.0)",
    "comtypes (>=1.4.11,<2.0.0)",
    "fastapi[standard] (>=0.116.1,<0.117.0)",
    "jdatetime (>=5.2.0,<6.0.0)",
    "pika (>=1.3.2,<2.0.0)",
    "pptxtopdf (>=0.0.2,<0.0.3)",
    "requests (>=2.32.5,<3.0.0)",
    "aiohttp (>=3.12.15,<4.0.0)",
    "aiofiles (>=24.1.0,<25.0.0)",
    "redis (>=6.4.0,<7.0.0)",
    "aio-pika (>=9.5.7,<10.0.0)",
    "apscheduler (>=3.11.0,<4.0.0)"
]



[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ruff = "^0.12.12"

[tool.ruff]
# Enable Black-compatible formatting
line-length = 88
indent-width = 4

# Enable isort-style import sorting
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
# Enable isort rules
select = ["I"]  # I = isort import sorting rules
ignore = []

[tool.ruff.lint.isort]

# Group imports like Black + isort standard
known-first-party = ["certificate-service"]  # Replace with your actual package name if different
# sections = ["future", "standard-library", "third-party", "first-party", "local-folder"]
order-by-type = true
case-sensitive = false
force-sort-within-sections = true
combine-as-imports = true

[tool.poetry.scripts]
format = "ruff format ."
lint = "ruff check . --fix"